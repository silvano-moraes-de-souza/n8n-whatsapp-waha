<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="n8n + WAHA: WhatsApp AI agent built in n8n with an LLM and Redis memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea4b71"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#ea4b71"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ea4b71" stop-opacity="0.30"/><stop offset="1" stop-color="#ea4b71" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#ea4b71"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#ea4b71" letter-spacing="2">AUTOMATION · WHATSAPP AI AGENT</text>
  <text x="92" y="167" class="sans" font-size="88" font-weight="800" fill="url(#shine)">n8n + WAHA</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">WhatsApp AI agent built in n8n with an LLM and Redis memory</text>
  <rect x="96" y="262" width="47" height="28" rx="14" fill="#161b22" stroke="#ea4b71" stroke-opacity="0.45"/><text x="119" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">n8n</text><rect x="153" y="262" width="55" height="28" rx="14" fill="#161b22" stroke="#ea4b71" stroke-opacity="0.45"/><text x="180" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">WAHA</text><rect x="217" y="262" width="63" height="28" rx="14" fill="#161b22" stroke="#ea4b71" stroke-opacity="0.45"/><text x="249" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Redis</text><rect x="290" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#ea4b71" stroke-opacity="0.45"/><text x="326" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Docker</text>
  <g><line x1="890" y1="170" x2="1160" y2="170" stroke="#ea4b71" stroke-opacity=".5" stroke-width="3" class="flow"/><line x1="1070" y1="190" x2="1070" y2="250" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 5"/><rect x="1022" y="250" width="96" height="40" rx="10" fill="#161b22" stroke="#0f766e"/><text x="1070" y="275" text-anchor="middle" class="sans" font-size="12" fill="#5eead4">LLM + memory</text><g class="fade d1"><rect x="862" y="150" width="80" height="40" rx="10" fill="#161b22" stroke="#ea4b71" stroke-width="2"/><text x="902" y="175" text-anchor="middle" class="sans" font-size="12" fill="#e6edf3">Webhook</text></g><g class="fade d2"><rect x="952" y="150" width="80" height="40" rx="10" fill="#161b22" stroke="#ea4b71" stroke-width="2"/><text x="992" y="175" text-anchor="middle" class="sans" font-size="12" fill="#e6edf3">Filter</text></g><g class="fade d3"><rect x="1042" y="150" width="80" height="40" rx="10" fill="#161b22" stroke="#ea4b71" stroke-width="2"/><text x="1082" y="175" text-anchor="middle" class="sans" font-size="12" fill="#e6edf3">AI Agent</text></g><g class="fade d4"><rect x="1132" y="150" width="80" height="40" rx="10" fill="#161b22" stroke="#ea4b71" stroke-width="2"/><text x="1172" y="175" text-anchor="middle" class="sans" font-size="12" fill="#e6edf3">WhatsApp</text></g><g><circle r="6" fill="#f5fbff"/><circle r="11" fill="#f5fbff" opacity=".25"/><animateMotion dur="3s" repeatCount="indefinite" path="M872 170 L1170 170"/></g><g class="fade d5"><rect x="1010" y="70" width="210" height="44" rx="12" fill="#005c4b"/><text x="1026" y="97" class="sans" font-size="13" fill="#e9edef">Reply sent on WhatsApp ✓✓</text></g></g>
</svg>
